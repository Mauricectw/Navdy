name: Build ZONOZ unsigned IPA

on:
  push:
    branches: [zonoz-ios]
  workflow_dispatch:

jobs:
  logic-tests:
    # 協定層與播放引擎只用 Foundation，對著假音箱在 Linux 上跑
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
      - name: Offline engine tests
        run: .github/scripts/run-and-annotate.sh tests.log logic-tests -- Tests/run_linux_tests.sh

  ios:
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate Xcode project
        run: .github/scripts/run-and-annotate.sh xcodegen.log xcodegen -- xcodegen generate

      - name: Build (no code signing)
        run: |
          .github/scripts/run-and-annotate.sh build.log xcodebuild -- xcodebuild \
            -project ZonozLocalStream.xcodeproj \
            -scheme ZonozLocalStream \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          test -d build/Build/Products/Release-iphoneos/ZonozLocalStream.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZonozLocalStream.app Payload/
          zip -qry ZONOZ-LocalStream-unsigned.ipa Payload

      - name: Inspect IPA
        run: |
          ls -lh ZONOZ-LocalStream-unsigned.ipa
          unzip -l ZONOZ-LocalStream-unsigned.ipa | tail -n 15
          APP=Payload/ZonozLocalStream.app
          for k in CFBundleIdentifier CFBundleShortVersionString MinimumOSVersion UIBackgroundModes NSBonjourServices UIFileSharingEnabled; do
            printf '%s = ' "$k"; /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" | tr '\n' ' '; echo
          done
          file "$APP/ZonozLocalStream"
          lipo -info "$APP/ZonozLocalStream"

      - name: Publish to release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=zonoz-ios-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "ZONOZ Local Stream iOS (unsigned test build)" \
              --notes "未簽名 IPA，用 Sideloadly 以自己的 Apple ID 簽名安裝。每次推送 zonoz-ios 分支都會覆蓋。"
          gh release upload "$TAG" ZONOZ-LocalStream-unsigned.ipa --clobber
          echo "build: $GITHUB_SHA" 

      - uses: actions/upload-artifact@v4
        with:
          name: ZONOZ-LocalStream-unsigned-ipa
          path: ZONOZ-LocalStream-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zonoz-build-log
          path: build.log

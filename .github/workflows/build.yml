name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol-tests:
    # The protocol layer is Foundation-only, so it is tested on cheap Linux minutes too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
      - name: Protocol tests (Linux)
        run: .github/scripts/run-and-annotate.sh test-linux.log linux-tests -- swift test --package-path Packages/NavdyWire

  ios:
    runs-on: xcode-27   # Xcode 27 / iOS 27 SDK, Apple Silicon
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate Xcode project
        run: .github/scripts/run-and-annotate.sh xcodegen.log xcodegen -- xcodegen generate

      - name: Protocol tests (macOS)
        run: .github/scripts/run-and-annotate.sh test-macos.log macos-tests -- swift test --package-path Packages/NavdyWire

      - name: Build (no code signing)
        if: success() || failure()   # still compile the app when the package tests fail
        run: |
          .github/scripts/run-and-annotate.sh build.log xcodebuild -- xcodebuild \
            -project NavdyHUD.xcodeproj \
            -scheme NavdyHUD \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          test -d build/Build/Products/Release-iphoneos/NavdyHUD.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NavdyHUD.app Payload/
          zip -qry NavdyHUD-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NavdyHUD-unsigned-ipa
          path: NavdyHUD-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol-tests:
    # The protocol layer is Foundation-only, so it is tested on cheap Linux minutes too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
      - run: swift test --package-path Packages/NavdyWire

  ios:
    needs: protocol-tests
    runs-on: xcode-27   # Xcode 27 / iOS 27 SDK, Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Protocol tests (macOS)
        run: swift test --package-path Packages/NavdyWire

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project NavdyHUD.xcodeproj \
            -scheme NavdyHUD \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*NavdyHUD|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/NavdyHUD.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NavdyHUD.app Payload/
          zip -qry NavdyHUD-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NavdyHUD-unsigned-ipa
          path: NavdyHUD-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
